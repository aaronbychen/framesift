# Full local stack: scanner API (GPU) + Redis Stack (caption/frame index) + Prometheus + Grafana.
#   docker compose up -d --build
# Needs the model folders under .data/models (see README). Nothing leaves the machine at runtime.
services:
  app:
    build: .
    image: nl-video-scanner:latest
    ports:
      - "8000:8000"
    environment:
      SERVING_MODE: ${SERVING_MODE:-batched}
      BATCH_MAX_SIZE: ${BATCH_MAX_SIZE:-4}
    volumes:
      - ./.data/models:/app/.data/models:ro
    depends_on:
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  redis:
    image: redis/redis-stack-server:7.4.0-v3
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  redis-data:
  prometheus-data:
